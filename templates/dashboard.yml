{{ if .Values.openshiftDashboardEnabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: '{{ .Release.Namespace }}-counter-dashboard'
  namespace: openshift-config-managed
  labels:
    console.openshift.io/dashboard: "true"
data:
  "{{ .Release.Namespace }}-counter-dashboard.json": |
    {
      "title": "Counter Dashboard ({{ .Release.Namespace }}/{{ .Release.Name }})",
      "rows": [
        {
          "title": "Counter",
          "panels": [
            {
              "title": "Counts",
              "type": "stat",
              "targets": [
                {
                  "expr": "max(counter_counter{namespace=\"{{ .Release.Namespace }}\"})"
                }
              ]
            },
            {
              "title": "Count increase 1m",
              "type": "stat",
              "targets": [
                {
                  "expr": "max(increase(counter_counter{namespace=\"{{ .Release.Namespace }}\"}[1m])) by (namespace)"
                }
              ]
            },
            {
              "title": "Count increase 5m",
              "type": "stat",
              "targets": [
                {
                  "expr": "max(increase(counter_counter{namespace=\"{{ .Release.Namespace }}\"}[5m])) by (namespace)"
                }
              ]
            }
          ]
        },
        {
          "title": "Request Rate",
          "panels": [
            {
              "title": "Requests per Second",
              "type": "graph",
              "targets": [
                {
                  "expr": "sum(irate(counter_requests_total{namespace=\"{{ .Release.Namespace }}\"}[10m])) by (path)",
                  "legendFormat": "{{`{{ path }}`}} req/s"
                }
              ]
            }
          ]
        }
      ]
    }
{{ end }}
